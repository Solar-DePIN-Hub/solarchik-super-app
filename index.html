<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0b1620" />
    <meta http-equiv="Permissions-Policy" content="microphone=*, autoplay=*" />
    <title>Solarchik CLOCK IN</title>
    <!-- This must be loaded before <base>: it is the Vercel-side bridge to the
         Worker. Everything after <base> intentionally uses the original static game. -->
    <script>
      // A root-relative src would also inherit the Netlify <base>. Build this URL
      // from the current Vercel (or localhost) origin so the bridge never escapes.
      document.write('<script src="' + location.origin + '/web-native.js?v=6"><\/script>');
    </script>
    <base href="https://solarchik-friend.netlify.app/" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0b1620; color: #e8f0f5; }
      #boot { padding: 2rem; font: 600 18px/1.4 Nunito, system-ui, sans-serif; }
    </style>
    <link rel="stylesheet" href="./assets/style.css" />
    <link rel="stylesheet" href="./assets/booth.css?v=11" />
  </head>
  <body>
    <div id="root"><p id="boot">Solarchik…</p></div>
    <script>
      window.onerror = function (message) {
        var target = document.getElementById("boot") || document.getElementById("root");
        if (target) target.textContent = String(message || "error");
      };
    </script>
    <script src="./assets/native.js?v=13"></script>
    <script>
      // The original bundle writes its own native bridge. Load our Vercel
      // bridge once more so chat and voice cannot fall back to Netlify.
      document.write('<script src="' + location.origin + '/web-native.js?v=6"><\/script>');
    </script>
    <script src="./assets/booth.js?v=11"></script>
  </body>
</html>
