<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#0b1620" />
    <meta http-equiv="Permissions-Policy" content="microphone=*, autoplay=*" />
    <title>Solarchik CLOCK IN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html, body, #root { height: 100%; margin: 0; background: #0b1620; color: #e8f0f5; }
      #boot { padding: 2rem; font: 600 18px/1.4 Nunito, system-ui, sans-serif; }
      /* Play Demo — under the red Secretary pill */
      #sc-play-demo {
        position: fixed;
        right: calc(4% + 10px);
        top: calc(12% + 44px);
        z-index: 45;
        display: none;
        align-items: center;
        justify-content: center;
        background: #1565c0;
        color: #fff;
        font: 700 11px/1.1 Nunito, system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-transform: none;
        padding: 6px 12px;
        border-radius: 999px;
        text-decoration: none;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        border: 0;
        cursor: pointer;
        white-space: nowrap;
      }
      #sc-play-demo.visible { display: inline-flex; }
      #sc-play-demo:hover { background: #1976d2; }
      @media (max-width: 720px) {
        #sc-play-demo {
          right: 10px;
          top: calc(10% + 44px);
        }
      }
    </style>
    <link rel="stylesheet" href="/assets/style.css" />
    <link rel="stylesheet" href="/assets/booth.css?v=11" />
  </head>
  <body>
    <div id="root"><p id="boot">Solarchik…</p></div>
    <a
      id="sc-play-demo"
      href="https://solar-screen-demo.netlify.app/"
      target="_blank"
      rel="noopener noreferrer"
      >Play Demo</a
    >
    <script>
      window.onerror = function (message) {
        var target = document.getElementById("boot") || document.getElementById("root");
        if (target) target.textContent = String(message || "error");
      };
      (function syncPlayDemo() {
        function tick() {
          var hot = document.getElementById("sc-booth-hot");
          var btn = document.getElementById("sc-play-demo");
          if (!btn) return;
          // Show with the Secretary hotzone when it appears; otherwise keep visible for the demo.
          if (!hot || hot.classList.contains("on") || hot.style.display === "block") {
            btn.classList.add("visible");
          } else {
            btn.classList.add("visible");
          }
        }
        tick();
        setInterval(tick, 400);
      })();
    </script>
    <script src="/assets/native.js?v=13"></script>
    <script src="/web-native.js?v=13"></script>
    <script src="/assets/booth.js?v=11"></script>
  </body>
</html>
